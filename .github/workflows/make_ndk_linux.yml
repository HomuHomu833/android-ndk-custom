name: Make NDK (Linux)
run-name: Make NDK-r${{inputs.version}}${{inputs.revision}}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "NDK Release version:"
        default: "30"
        required: true
        type: string
      revision:
        description: "NDK Release revision:"
        required: false
        type: string
      only:
        description: "Only these targets (JSON array), default all"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-ndk.yml
    secrets: inherit
    with:
      platform: linux
      version: ${{ inputs.version }}
      revision: ${{ inputs.revision }}
      only: ${{ inputs.only }}
      # loongarch32-linux-gnu, loongarch32-linux-gnusf, sparc-linux-gnu
      targets: >-
        ["aarch64-linux-musl", "aarch64-linux-gnu", "aarch64_be-linux-gnu",
         "aarch64_be-linux-musl", "arm-linux-gnueabi", "arm-linux-gnueabihf",
         "arm-linux-musleabi", "arm-linux-musleabihf", "armeb-linux-gnueabi",
         "armeb-linux-gnueabihf", "armeb-linux-musleabi", "armeb-linux-musleabihf",
         "hexagon-linux-musl", "loongarch64-linux-gnu", "loongarch64-linux-musl",
         "loongarch64-linux-muslf32", "loongarch64-linux-gnusf",
         "loongarch64-linux-muslsf", "mips-linux-gnueabi",
         "mips-linux-gnueabihf", "mips-linux-musleabi", "mips-linux-musleabihf",
         "mips64-linux-gnuabi64",
         "mips64-linux-muslabi64",
         "mips64el-linux-gnuabi64",
         "mips64el-linux-muslabi64",
         "mipsel-linux-gnueabi", "mipsel-linux-gnueabihf",
         "mipsel-linux-musleabi", "mipsel-linux-musleabihf",
         "powerpc-linux-musleabi", "powerpc-linux-musleabihf",
         "powerpc64-linux-musl", "powerpc64le-linux-musl", "powerpc64le-linux-gnu",
         "riscv32-linux-gnu", "riscv32-linux-musl",
         "riscv64-linux-musl", "riscv64-linux-gnu", "s390x-linux-gnu",
         "s390x-linux-musl", "sparc64-linux-gnu", "thumb-linux-musleabi",
         "thumb-linux-musleabihf", "thumbeb-linux-musleabi", "thumbeb-linux-musleabihf",
         "x86-linux-gnu", "x86-linux-musl", "x86_64-linux-musl",
         "x86_64-linux-muslx32", "x86_64-linux-gnu", "x86_64-linux-gnux32"]
